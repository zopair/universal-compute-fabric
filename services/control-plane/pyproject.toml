[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ucf-control-plane"
version = "0.1.0"
description = "Hybrid edge-cloud workload placement control plane prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1.0", "uvicorn[standard]>=0.27,<1.0", "pydantic>=2.6,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.3,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ucf*"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
