name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/control-plane/pyproject.toml
      - name: Install
        run: python -m pip install -e "services/control-plane[dev]"
      - name: Lint
        run: ruff check services tests
      - name: Migration smoke test
        run: DATABASE_URL=sqlite:////tmp/ucf-ci.db alembic upgrade head
      - name: Test
        run: pytest -q
