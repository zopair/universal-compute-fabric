services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ucf
      POSTGRES_USER: ucf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ucf-development-only}
    volumes:
      - ucf-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucf -d ucf"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  control-plane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      UCF_ENV: ${UCF_ENV:-development}
      DATABASE_URL: postgresql+psycopg://ucf:${POSTGRES_PASSWORD:-ucf-development-only}@postgres:5432/ucf
      UCF_ADMIN_API_KEY: ${UCF_ADMIN_API_KEY:-}
      UCF_NODE_LEASE_SECONDS: ${UCF_NODE_LEASE_SECONDS:-45}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  ucf-postgres:
